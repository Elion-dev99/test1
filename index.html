<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>在庫増減グラフ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  .tabs {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px;
    margin: 0 5px;
    background: #333;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab.active {
    background: #7f00ff;
  }
  .chart-container {
    width: 100%;
    max-width: 900px;
    margin: auto;
  }
  canvas {
    background: #222;
    border-radius: 10px;
    padding: 10px;
  }
</style>
</head>
<body>

<h1>在庫増減グラフ</h1>

<div class="tabs">
  <div class="tab active" data-target="daily">日毎</div>
  <div class="tab" data-target="monthly">月毎</div>
  <div class="tab" data-target="yearly">年毎</div>
</div>

<div class="chart-container">
  <canvas id="dailyChart"></canvas>
  <canvas id="monthlyChart" style="display:none;"></canvas>
  <canvas id="yearlyChart" style="display:none;"></canvas>
</div>

<script>
// ------------------------------
// 在庫履歴データ（本番は差し替え）
// ------------------------------
const stockHistory = [
  { date: "2026-07-01", stock: 120 },
  { date: "2026-07-02", stock: 115 },
  { date: "2026-07-03", stock: 130 },
  { date: "2026-07-04", stock: 128 },
  { date: "2026-07-05", stock: 140 },
  { date: "2026-08-01", stock: 150 },
  { date: "2026-08-02", stock: 155 },
  { date: "2027-01-01", stock: 160 }
];

// ------------------------------
// 日毎の増減計算
// ------------------------------
const dailyLabels = stockHistory.map(i => i.date);
const dailyChanges = stockHistory.map((item, index) => {
  if (index === 0) return 0;
  return item.stock - stockHistory[index - 1].stock;
});

// ------------------------------
// 月毎の増減計算
// ------------------------------
function calcMonthlyChanges(history) {
  const monthly = {};

  history.forEach(item => {
    const month = item.date.slice(0, 7); // YYYY-MM
    if (!monthly[month]) monthly[month] = [];
    monthly[month].push(item.stock);
  });

  const result = [];
  Object.keys(monthly).forEach(month => {
    const stocks = monthly[month];
    const change = stocks[stocks.length - 1] - stocks[0];
    result.push({ month, change });
  });

  return result;
}

const monthlyData = calcMonthlyChanges(stockHistory);
const monthlyLabels = monthlyData.map(i => i.month);
const monthlyChanges = monthlyData.map(i => i.change);

// ------------------------------
// 年毎の増減計算
// ------------------------------
function calcYearlyChanges(history) {
  const yearly = {};

  history.forEach(item => {
    const year = item.date.slice(0, 4);
    if (!yearly[year]) yearly[year] = [];
    yearly[year].push(item.stock);
  });

  const result = [];
  Object.keys(yearly).forEach(year => {
    const stocks = yearly[year];
    const change = stocks[stocks.length - 1] - stocks[0];
    result.push({ year, change });
  });

  return result;
}

const yearlyData = calcYearlyChanges(stockHistory);
const yearlyLabels = yearlyData.map(i => i.year);
const yearlyChanges = yearlyData.map(i => i.change);

// ------------------------------
// グラフ描画
// ------------------------------
const dailyChart = new Chart(document.getElementById("dailyChart"), {
  type: "line",
  data: {
    labels: dailyLabels,
    datasets: [{
      label: "日毎の在庫増減",
      data: dailyChanges,
      borderColor: "#7f00ff",
      backgroundColor: "rgba(127,0,255,0.2)",
      borderWidth: 2
    }]
  }
});

const monthlyChart = new Chart(document.getElementById("monthlyChart"), {
  type: "bar",
  data: {
    labels: monthlyLabels,
    datasets: [{
      label: "月毎の在庫増減",
      data: monthlyChanges,
      backgroundColor: "rgba(0,150,255,0.6)"
    }]
  }
});

const yearlyChart = new Chart(document.getElementById("yearlyChart"), {
  type: "bar",
  data: {
    labels: yearlyLabels,
    datasets: [{
      label: "年毎の在庫増減",
      data: yearlyChanges,
      backgroundColor: "rgba(0,255,150,0.6)"
    }]
  }
});

// ------------------------------
// タブ切り替え
// ------------------------------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    const target = tab.dataset.target;

    document.getElementById("dailyChart").style.display = "none";
    document.getElementById("monthlyChart").style.display = "none";
    document.getElementById("yearlyChart").style.display = "none";

    document.getElementById(target + "Chart").style.display = "block";
  });
});
</script>

</body>
</html>
